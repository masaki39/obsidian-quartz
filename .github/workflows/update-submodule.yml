# .github/workflows/update-submodule.yml
name: Update Submodule

on:
  schedule:
    # 毎日 0:00 JST (15:00 UTC) に実行
    - cron: '0 15 * * *'
  workflow_dispatch:  # 手動実行も可能

jobs:
  update-submodule:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT_TOKEN }}
        submodules: recursive
    
    - name: Update submodule to latest
      run: |
        # サブモジュール内の未追跡ファイルと変更をクリーンアップ
        git submodule foreach --recursive git clean -fdx
        git submodule foreach --recursive git reset --hard

        # サブモジュールを強制的に最新に更新（再帰的に）
        git submodule update --remote --force --recursive

        # Git設定（先に設定しておく）
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git submodule foreach --recursive git config user.email "action@github.com"
        git submodule foreach --recursive git config user.name "GitHub Action"

        # サブモジュール内のネストされたサブモジュールの変更をコミット
        cd content
        if ! git diff --quiet || ! git diff --cached --quiet; then
          git add .
          git commit -m "Auto-update nested submodules" || true
        fi
        cd ..

        # メインリポジトリでサブモジュールのコミットハッシュが変更されたかチェック
        if git diff --quiet HEAD -- content; then
          echo "No changes to commit"
          exit 0
        fi

        # サブモジュールの変更をコミット
        git add content
        git commit -m "Auto-update submodule to latest commit"
        git push
